name: Weekly Model Scraper

# Refreshes the registries the scrapers rebuild unattended (OpenRouter with
# metrics, OpenAI, AWS Bedrock; see `scrape:auto` in packages/models) and opens
# or updates a draft pull request with the changes. Replicate stays manual: its
# transformers are generated by an LLM and need review.

on:
  schedule:
    # Sundays at 07:23 UTC
    - cron: '23 7 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-scrape-models
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  scrape-models:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The scrapers run from source (tsx resolves @aeye/* through the tsconfig
      # paths), so no package build is needed.
      - name: Scrape OpenRouter, OpenAI, and AWS Bedrock
        id: scrape
        working-directory: packages/models
        run: npm run scrape:auto
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # A failed source fails the run, but the sources that succeeded still
      # regenerated their registries, so they are proposed all the same.
      - name: Open or update the draft pull request
        if: ${{ !cancelled() && steps.scrape.outcome != 'skipped' }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automated/weekly-model-scrape
          delete-branch: true
          draft: true
          add-paths: packages/models/src
          commit-message: 'chore(models): weekly registry refresh'
          title: 'chore(models): weekly registry refresh'
          body: |
            Registries regenerated by the weekly model scraper
            ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})):

            - OpenRouter: models, pricing, and endpoint metrics (latency, throughput, uptime)
            - OpenAI: models from the docs pages, pricing, shutdown dates
            - AWS Bedrock: models from the user guide's model cards, prices from the public price list

            Replicate is not included; run `npm run scrape:replicate` by hand.
          labels: |
            automated
            models
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
